<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Happy Birthday!</h1>
        <div class="gift-container" id="gift-container">
            <img src="assets/gift.png" alt="Birthday Gift" class="gift-img" id="gift-img">
        </div>
        <div class="surprises-container" id="surprises-container">
            <img src="assets/Group 2.png" alt="Group 2" class="surprise-item item-1">
            <img src="assets/surprise1.png" alt="Surprise 1" class="surprise-item item-2">
            <img src="assets/surprise3.png" alt="Surprise 3" class="surprise-item item-3">
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
